<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Listado de coches</title>
</head>
<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Listado de coches</h1>
        <a class="btn btn-primary" th:href="@{/coches/nuevo}">Nuevo coche</a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Matricula</th>
                <th>Anio</th>
                <th>Color</th>
                <th>Precio</th>
                <th>Kilometraje</th>
                <th>Combustible</th>
                <th>Transmision</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="coche : ${coches}">
                <td th:text="${coche.marca}"></td>
                <td th:text="${coche.modelo}"></td>
                <td th:text="${coche.matricula}"></td>
                <td th:text="${coche.anioFabricacion}"></td>
                <td th:text="${coche.color}"></td>
                <td th:text="${#numbers.formatDecimal(coche.precio, 1, 2)} + ' €'"></td>
                <td th:text="${coche.kilometraje} + ' km'"></td>
                <td th:text="${coche.combustible}"></td>
                <td th:text="${coche.transmision}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/coches/editar/{id}(id=${coche.id})}">Editar</a>
                    <form class="d-inline" method="post"
                          th:action="@{/coches/eliminar/{id}(id=${coche.id})}"
                          onsubmit="return confirm('¿Seguro que deseas eliminar este coche?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(coches)}">
                <td colspan="10" class="text-center text-muted">No hay coches registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
