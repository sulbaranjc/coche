spring.application.name=coche

# Puerto de la aplicacion (8080 estaba ocupado)
server.port=8081

# Conexion a MySQL (usa variables de entorno para no exponer credenciales en el repositorio)
spring.datasource.url=jdbc:mysql://localhost:3306/coche_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: el esquema lo crean schema.sql / data.sql, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejecuta schema.sql y data.sql en cada arranque, antes de que Hibernate valide el esquema
spring.sql.init.mode=always
